<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work item viewer</title>
    <meta name="color-scheme" content="dark light">
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>Work item viewer</h1>
        <p id="status" role="status">Loading work items…</p>
      </div>
      <div class="controls">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark" selected>Dark</option>
        </select>
        <label for="filter">Find work items</label>
        <input id="filter" type="search" placeholder="Find a work item, project, or program…" autocomplete="off">
        <label class="compact-control" for="compact-view">
          <input id="compact-view" type="checkbox" checked>
          Hide empty rows and columns
        </label>
        <button id="refresh" type="button">Refresh view</button>
      </div>
      <section id="stage-order-editor" class="stage-order-editor" hidden aria-labelledby="stage-order-heading">
        <h2 id="stage-order-heading">Board row order</h2>
        <p id="stage-order-help">Choose the order of stage rows. Changes apply after Save.</p>
        <ol id="stage-order-list" class="stage-order-list" aria-describedby="stage-order-help"></ol>
        <div class="stage-order-actions">
          <button id="stage-order-save" type="button">Save</button>
          <button id="stage-order-cancel" type="button">Cancel</button>
          <button id="stage-order-reset" type="button">Reset</button>
        </div>
        <p id="stage-order-status" class="stage-order-status" role="status" aria-live="polite"></p>
      </section>
    </header>
    <main id="board" aria-live="polite"></main>
    <aside id="details" class="details" aria-label="Selected work item details">
      <h2>Select a work item</h2>
      <p>Choose a card to inspect its details.</p>
    </aside>
    <script src="/static/app.js" defer></script>
  </body>
</html>
