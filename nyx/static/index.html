<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work item viewer</title>
    <meta name="color-scheme" content="dark light">
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="brand" aria-label="Nyx by D10 Analytics">
        <img class="brand-logo" src="/static/d10-diamond.svg" alt="" width="60" height="60">
        <div class="brand-text">
          <span class="brand-name">Nyx</span>
          <span class="brand-attribution">by D10 Analytics</span>
        </div>
      </div>
      <div class="toolbar-actions">
        <details id="stage-order-editor" class="stage-order-editor">
          <summary id="stage-order-heading">Board settings</summary>
          <div class="stage-order-content">
            <label class="selection-preference" for="deselect-on-empty-click">
              <input id="deselect-on-empty-click" type="checkbox">
              Click empty space to deselect
            </label>
            <p class="selection-preference-help">Applies immediately in this browser.</p>
            <div id="stage-order-controls" hidden>
              <p id="stage-order-help">Choose the order of stage rows and which stages count as finished. Save to apply these changes.</p>
              <ol id="stage-order-list" class="stage-order-list" aria-describedby="stage-order-help"></ol>
              <div class="stage-order-actions">
                <button id="stage-order-save" type="button">Save</button>
                <button id="stage-order-cancel" type="button">Cancel</button>
                <button id="stage-order-reset" type="button">Reset</button>
                <button id="stage-order-reload" type="button" hidden>Reload board settings</button>
              </div>
              <p id="stage-order-status" class="stage-order-status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </details>
        <div class="controls">
          <div class="view-switch" role="group" aria-label="View">
            <button id="view-board" type="button" aria-pressed="true">Board</button>
            <button id="view-checkouts" type="button" aria-pressed="false">Checkouts</button>
          </div>
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark" selected>Dark</option>
          </select>
          <label for="filter">Search</label>
          <input id="filter" type="search" placeholder="Find a work item, project, or program…" autocomplete="off">
          <div class="compact-controls">
            <label class="compact-control" for="compact-view">
              <input id="compact-view" type="checkbox" checked>
              Hide empty rows and columns
            </label>
            <label class="compact-control" for="hide-terminal-rows">
              <input id="hide-terminal-rows" type="checkbox" checked>
              Hide terminal rows
            </label>
          </div>
          <label class="compact-control checkouts-control" for="hide-quiet-checkouts" hidden>
            <input id="hide-quiet-checkouts" type="checkbox" checked>
            Hide quiet checkouts
          </label>
          <button id="refresh" type="button">Refresh view</button>
        </div>
      </div>
    </header>
    <main id="board"></main>
    <main id="checkouts" aria-labelledby="checkouts-heading" hidden>
      <h1 id="checkouts-heading">Checkouts</h1>
      <div class="checkouts-status">
        <p id="checkouts-status-line" class="checkouts-status-line"></p>
        <button id="check-remotes" type="button">Check remotes now</button>
        <p id="checkouts-action-status" class="checkouts-action-status" role="status" aria-atomic="true"></p>
        <details id="checkout-folders-editor" class="checkout-folders-editor" hidden>
          <summary>Checkout folders</summary>
          <div class="checkout-folders-content">
            <ul id="checkout-folders-list" class="checkout-folders-list" aria-label="Checkout folders"></ul>
            <div class="checkout-folders-add">
              <label for="checkout-folders-path">Checkout folder path</label>
              <input id="checkout-folders-path" type="text" autocomplete="off" spellcheck="false">
              <button id="checkout-folders-add" type="button">Add</button>
            </div>
            <ul id="checkout-folders-suggestions" class="checkout-folders-suggestions" aria-label="Suggested checkout folders"></ul>
            <label class="compact-control" for="checkout-folders-github">
              <input id="checkout-folders-github" type="checkbox">
              Look up pull requests with the GitHub CLI (gh)
            </label>
            <div class="checkout-folders-actions">
              <button id="checkout-folders-save" type="button" aria-disabled="true">Save checkout folders</button>
              <button id="checkout-folders-cancel" type="button" aria-disabled="true">Cancel checkout folder changes</button>
              <button id="checkout-folders-reload" type="button" hidden>Reload checkout folders</button>
            </div>
            <p id="checkout-folders-status" class="checkout-folders-status" role="status" aria-live="polite"></p>
          </div>
        </details>
      </div>
      <div id="checkouts-body"></div>
    </main>
    <p id="refresh-status" class="visually-hidden" role="status" aria-atomic="true"></p>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <script src="/static/app.js" defer></script>
  </body>
</html>
