[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx"
version = "0.1.0"
description = "Private catalog viewer"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "playwright", "ruff"]
desktop = ["PySide6>=6.8"]
# Pinned standalone-build inputs.  PySide6 is LGPL-3.0/GPL-3.0/commercial and
# Nuitka is Apache-2.0; both are redistributable in the private internal
# artifacts this extra builds.  The versions match the deployment tool's
# default toolchain so a build does not silently select a different compiler.
# pefile (MIT) provides the deterministic Windows dependency scan that avoids
# the interactive Dependency Walker download.
build = [
    "PySide6==6.11.2",
    "Nuitka==4.1.1",
    "ordered-set==4.1.0",
    "zstandard==0.25.0",
    "pefile==2024.8.26",
]

[project.scripts]
nyx = "nyx.cli:main"
nyx-desktop = "nyx.desktop:main"

[tool.setuptools.packages.find]
include = ["nyx*"]

[tool.setuptools.package-data]
nyx = ["static/*.html", "static/*.js", "static/*.css"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
