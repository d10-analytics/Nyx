name: tests

on: [push]

jobs:
  nyx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify package and installed service
        run: |
          set -euo pipefail
          runner_python="$(command -v python)"
          "$runner_python" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "$runner_python" -m pip install --upgrade pip
          "$runner_python" -m pip install -e '.[test]' build
          "$runner_python" -m playwright install --with-deps chromium
          ruff check .
          "$runner_python" -m pytest tests/ -v
          "$runner_python" -m build --wheel
          wheel_count="$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)"
          test "$wheel_count" -eq 1
          "$runner_python" -m pytest tests/test_wheel_install.py -v
          nyx_verify_user=nyx-verify
          nyx_verify_root=/opt/nyx-verify
          cleanup() {
            if id "$nyx_verify_user" >/dev/null 2>&1; then
              sudo -u "$nyx_verify_user" -H env -u PYTHONPATH -u PYTHONHOME \
                "$nyx_verify_root/venv/bin/nyx" --stop >/dev/null 2>&1 || true
              sudo userdel --remove "$nyx_verify_user"
            fi
          }
          trap cleanup EXIT
          sudo useradd --create-home --shell /bin/bash "$nyx_verify_user"
          nyx_verify_home="$(getent passwd "$nyx_verify_user" | cut -d: -f6)"
          sudo install -d --owner="$nyx_verify_user" --group="$nyx_verify_user" --mode=0700 \
            "$nyx_verify_root" "$nyx_verify_root/exercise" "$nyx_verify_root/wheels" \
            "$nyx_verify_root/playwright-browsers" \
            "$nyx_verify_home/.local" "$nyx_verify_home/.local/bin"
          sudo -u "$nyx_verify_user" -H "$runner_python" -m venv "$nyx_verify_root/venv"
          nyx_verify_wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#nyx_verify_wheels[@]}" -eq 1
          test -f "${nyx_verify_wheels[0]}"
          nyx_verify_wheel="$nyx_verify_root/wheels/${nyx_verify_wheels[0]##*/}"
          sudo install --owner="$nyx_verify_user" --group="$nyx_verify_user" --mode=0600 \
            "${nyx_verify_wheels[0]}" "$nyx_verify_wheel"
          sudo -u "$nyx_verify_user" -H "$nyx_verify_root/venv/bin/python" -m pip install \
            "$nyx_verify_wheel" pytest playwright
          sudo -u "$nyx_verify_user" -H env \
            PLAYWRIGHT_BROWSERS_PATH="$nyx_verify_root/playwright-browsers" \
            "$nyx_verify_root/venv/bin/python" -m playwright install chromium
          sudo -u "$nyx_verify_user" -H ln -s "$nyx_verify_root/venv/bin/nyx" \
            "$nyx_verify_home/.local/bin/nyx"
          sudo install --owner="$nyx_verify_user" --group="$nyx_verify_user" --mode=0600 \
            tests/test_installed_service.py "$nyx_verify_root/exercise/test_installed_service.py"
          timeout --preserve-status 90s sudo -u "$nyx_verify_user" -H env -u PYTHONPATH -u PYTHONHOME \
            PLAYWRIGHT_BROWSERS_PATH="$nyx_verify_root/playwright-browsers" \
            PATH="$nyx_verify_home/.local/bin:/usr/bin:/bin" \
            /bin/bash -c 'cd "$1" && exec "$2" -m pytest test_installed_service.py -v' \
            nyx-service-test "$nyx_verify_root/exercise" "$nyx_verify_root/venv/bin/python"
          "$runner_python" -m pytest tests/test_wheel_install.py -v

      - name: Verify documented installation commands
        shell: bash
        env:
          NYX_VERIFY_DOCUMENTED_INSTALL: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_documented_install.py -v

  nyx-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify package and installed lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.[test,desktop]' build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/ -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -Path dist -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheels.Count)"
          }
          python -m pytest tests/test_wheel_install.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native desktop source and session
        shell: pwsh
        env:
          NYX_REQUIRE_NATIVE_DESKTOP: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest tests/test_desktop.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify documented installation commands
        shell: pwsh
        env:
          NYX_VERIFY_DOCUMENTED_INSTALL: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest tests/test_documented_install.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  nyx-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify package and installed lifecycle
        shell: bash
        run: |
          set -euo pipefail
          runner_python="$(command -v python)"
          "$runner_python" -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          "$runner_python" -m pip install --upgrade pip
          "$runner_python" -m pip install -e '.[test,desktop]' build
          "$runner_python" -m playwright install chromium
          ruff check .
          "$runner_python" -m pytest tests/ -v
          "$runner_python" -m build --wheel
          wheel_count="$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)"
          test "$wheel_count" -eq 1
          "$runner_python" -m pytest tests/test_wheel_install.py -v

      - name: Verify native desktop source and session
        env:
          NYX_REQUIRE_NATIVE_DESKTOP: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_desktop.py -v

      - name: Verify documented installation commands
        shell: bash
        env:
          NYX_VERIFY_DOCUMENTED_INSTALL: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_documented_install.py -v
